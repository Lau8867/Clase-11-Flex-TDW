<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza-Delivery</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img src="./Img/Logo.jpg" alt="Pizza&Front" class="logo" />
      </div>
      <nav class="nav">
        <a href="#"> Home</a>
        <a href="#"> Ranking</a>
        <a href="#"> Promoción</a>
        <a href="#"> Contacto</a>
      </nav>
    </header>
    <main>
      <!--contenedor padre-->
      <section class="conteiner-padre">
        <!--tarjeta izquierda- envío gratis-->
        <div class="card-envío">
          <img src="./Img/Delivery.jpg" alt="Delivery" />
          <!--<span class="texto-uno" Envío gratis></span>-->
          <!--<span class="texto-dos" comprando></span>-->
          <!--<span class="texto-uno" 2 pizzas></span>-->
        </div>
        <!--tarjeta derecha-->
        <div class="card-podio">
          <h2>Podio de pizzas</h2>
          <div class="contenido-podio">
            <div class="más-pedida">
              <h3>Pizzas top 5</h3>
              <ol>
                <li>Muzzarella</li>
                <li>Hawaiana</li>
                <li>Muzzarella j&Morrón</li>
                <li>Fugazeta</li>
                <li>Calabresa</li>
              </ol>
            </div>
            <div class="imagen-trofeo">
              <img src="./img/PizzaFalling.jpg" alt="Trofeo de pizza" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer Class="footer">
      <ul class="footer-links">
        <li><a href="#"> Home</a></li>
        <li><a href="#"> Contacto</a></li>
        <li><a href="#"> Ranking</a></li>
        <li><a href="#"> Promoción</a></li>
      </ul>

      <div class="loguito">
        <img src="./Img/Logo.jpg" alt="Pizza & Front" class="loguito" />
      </div>
    </footer>
  </body>
</html>
